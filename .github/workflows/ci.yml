# Every push and pull request: typecheck, lint, all tests (with PostgreSQL and
# ffmpeg, like your Mac), and a production build of the web app.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cvu
          POSTGRES_PASSWORD: cvu
          POSTGRES_DB: claru_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cvu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://cvu:cvu@localhost:5432/claru_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, tests
        run: npm run check
      - name: Build the web app
        run: npm run build -w @cvu/web
